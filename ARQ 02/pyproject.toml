[project]
name = "shortener-v2"
version = "0.1.0"
description = "Arquitectura 2 de la Tarea 2 INF326"
requires-python = ">=3.11"
dependencies = ["litestar>=2.0,<3.0", "pybase62>=1.0.0", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
